<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#7fb66d" />
  <meta name="description" content="Kim Yongjin pixel desktop portfolio" />
  <title>YONGJIN OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-orb"><span></span></div>
      <div class="boot-kicker">WELCOME TO</div>
      <h1>YONGJIN OS</h1>
      <p>an interactive pixel portfolio</p>
      <button id="enterBtn" class="px-btn primary">CLICK TO START</button>
      <small>Best experienced on desktop · mobile supported</small>
    </div>
  </div>

  <main id="desktop" class="desktop hidden">
    <div class="sky-decor cloud c1"></div>
    <div class="sky-decor cloud c2"></div>
    <div class="sky-decor star s1">✦</div>
    <div class="sky-decor star s2">✦</div>

    <header class="menubar">
      <div class="menu-left">
        <button class="brand-menu" data-open="about">YJ</button>
        <span>YONGJIN OS</span>
        <button data-open="about">About</button>
        <button data-open="career">Career</button>
        <button data-open="projects">Projects</button>
      </div>
      <div class="menu-right">
        <span id="clock">--:--</span>
        <button id="soundBtn" aria-label="toggle sound">♪</button>
      </div>
    </header>

    <section class="hero-copy">
      <p class="hero-tag">HELLO, WORLD!</p>
      <h2>I build things<br>between <em>people</em><br>and <em>technology.</em></h2>
      <p>IT Specialist · Web Builder · Multilingual Communicator</p>
    </section>

    <section class="desktop-icons" aria-label="desktop shortcuts">
      <button class="desktop-icon" data-open="about">
        <span class="icon pixel-face"><i></i></span>
        <b>ABOUT ME</b>
      </button>
      <button class="desktop-icon" data-open="career">
        <span class="icon folder-icon"><i></i></span>
        <b>CAREER</b>
      </button>
      <button class="desktop-icon" data-open="projects">
        <span class="icon cart-icon"><i></i></span>
        <b>PROJECTS</b>
      </button>
      <button class="desktop-icon" data-open="skills">
        <span class="icon badge-icon">★</span>
        <b>SKILLS</b>
      </button>
      <button class="desktop-icon" data-open="contact">
        <span class="icon mail-icon"><i></i></span>
        <b>CONTACT</b>
      </button>
      <a class="desktop-icon" href="https://github.com/msuleu4-web" target="_blank" rel="noreferrer">
        <span class="icon github-icon">GH</span>
        <b>GITHUB</b>
      </a>
    </section>

    <div class="landscape">
      <div class="mountain m1"></div>
      <div class="mountain m2"></div>
      <div class="hill h1"></div>
      <div class="hill h2"></div>
      <div class="ground"></div>
      <div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div>
      <div class="character" id="character">
        <span class="hair"></span><span class="head"></span><span class="shirt"></span><span class="leg l"></span><span class="leg r"></span>
      </div>
    </div>

    <nav class="dock">
      <button data-open="about"><span class="dock-face"></span><small>About</small></button>
      <button data-open="career"><span class="dock-folder"></span><small>Career</small></button>
      <button data-open="projects"><span class="dock-game">▶</span><small>Projects</small></button>
      <button data-open="skills"><span class="dock-star">★</span><small>Skills</small></button>
      <button data-open="contact"><span class="dock-mail">✉</span><small>Contact</small></button>
    </nav>
  </main>

  <section id="windowLayer" class="window-layer hidden" aria-live="polite">
    <article id="appWindow" class="app-window">
      <header class="window-bar">
        <div class="traffic">
          <button id="closeWindow" class="red" aria-label="close"></button>
          <button class="yellow" aria-label="minimize"></button>
          <button class="green" aria-label="maximize"></button>
        </div>
        <strong id="windowTitle">ABOUT ME</strong>
        <div class="window-grip">•••</div>
      </header>
      <div id="windowBody" class="window-body"></div>
    </article>
  </section>

  <template id="about">
    <section class="content about-layout">
      <div class="avatar-card">
        <div class="big-avatar">
          <span class="av-hair"></span><span class="av-face"></span><span class="av-body"></span>
        </div>
        <div>
          <span class="label">PLAYER 01</span>
          <h3>KIM YONGJIN</h3>
          <p>キム・ヨンジン</p>
        </div>
      </div>
      <div>
        <p class="eyebrow">ABOUT ME</p>
        <h2>技術とコミュニケーションをつなぐ。</h2>
        <p class="lead">複雑な課題を整理し、相手に伝わる形へ変えることを得意とするITスペシャリストです。</p>
        <dl class="profile-list">
          <dt>BASE</dt><dd>埼玉県 / Japan</dd>
          <dt>LANGUAGES</dt><dd>韓国語・日本語・英語</dd>
          <dt>INTERESTS</dt><dd>Web開発、クラウド、データ分析、サッカー</dd>
        </dl>
      </div>
    </section>
  </template>

  <template id="career">
    <section class="content">
      <p class="eyebrow">CAREER.LOG</p>
      <h2>Experience</h2>
      <div class="career-list">
        <article>
          <div class="career-date">2025 — NOW</div>
          <div>
            <h3>日本アイ・ビー・エム デジタルサービス株式会社</h3>
            <p>金融業界向けWebシステムの保守運用に従事。障害調査、ログ分析、テスト、定期データ更新、簡易改修、関係者への報告を担当。</p>
            <div class="chips"><span>Java</span><span>JSP</span><span>SQL</span><span>Linux</span><span>DB2</span></div>
          </div>
        </article>
        <article>
          <div class="career-date">PAST</div>
          <div>
            <h3>営業・通訳・大学図書館・スポーツクラブ</h3>
            <p>多言語案内の改善、営業通訳、顧客対応などを経験。ユーザー視点と調整力を培いました。</p>
          </div>
        </article>
      </div>
    </section>
  </template>

  <template id="projects">
    <section class="content">
      <p class="eyebrow">SELECT A PROJECT</p>
      <h2>Things I Built</h2>
      <div class="project-list">
        <a href="https://github.com/msuleu4-web/soccer-project" target="_blank" rel="noreferrer" class="project-row">
          <div class="project-cover goal"><span>⚽</span></div>
          <div><span class="label">WEB APP · NO.01</span><h3>GOAL LABO</h3><p>サッカー情報、AI会話、予測・シミュレーションを組み合わせたWebサービス。</p></div>
          <b>↗</b>
        </a>
        <article class="project-row">
          <div class="project-cover dojo"><span>剣</span></div>
          <div><span class="label">EDTECH · NO.02</span><h3>SIer道場</h3><p>SIer業務をゲーム形式で学べる教育コンテンツ。</p></div>
          <b>DEV</b>
        </article>
        <article class="project-row">
          <div class="project-cover stock"><span>↗</span></div>
          <div><span class="label">RESEARCH · NO.03</span><h3>STOCK ANALYSIS LAB</h3><p>テクニカル指標とバックテストを使った株式分析研究。</p></div>
          <b>LAB</b>
        </article>
      </div>
    </section>
  </template>

  <template id="skills">
    <section class="content">
      <p class="eyebrow">PLAYER STATS</p>
      <h2>Skills & Badges</h2>
      <div class="stat-grid">
        <div><span>WEB / APP</span><b>76</b><i><u style="width:76%"></u></i></div>
        <div><span>CLOUD / AWS</span><b>70</b><i><u style="width:70%"></u></i></div>
        <div><span>ANALYSIS</span><b>82</b><i><u style="width:82%"></u></i></div>
        <div><span>COMMUNICATION</span><b>90</b><i><u style="width:90%"></u></i></div>
      </div>
      <div class="badge-wall">
        <span>AWS Cloud Practitioner</span>
        <span>AWS AI Practitioner</span>
        <span>JLPT N1</span>
        <span>TOEFL iBT 97</span>
      </div>
    </section>
  </template>

  <template id="contact">
    <section class="content contact-layout">
      <div>
        <p class="eyebrow">NEW MESSAGE</p>
        <h2>Let's connect.</h2>
        <p class="lead">ポートフォリオをご覧いただき、ありがとうございます。</p>
      </div>
      <div class="contact-card">
        <a href="https://github.com/msuleu4-web" target="_blank" rel="noreferrer">OPEN GITHUB ↗</a>
        <a href="mailto:your-email@example.com">SEND EMAIL ↗</a>
        <small>index.html内の your-email@example.com を変更してください。</small>
      </div>
    </section>
  </template>

  <script src="./script.js"></script>
</body>
</html>
