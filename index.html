<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIM YONGJIN | Career Quest</title>
  <meta name="description" content="Kim Yongjin's pixel RPG portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="startScreen" class="start-screen">
    <div class="logo-wrap">
      <div class="logo-sub">KIM YONGJIN'S</div>
      <div class="logo-main">CAREER QUEST</div>
      <div class="logo-jp">キャリア・クエスト</div>
    </div>
    <button id="startBtn" class="pixel-btn">PRESS START</button>
    <p>方向キー / WASDで移動　Enterで調べる</p>
  </div>

  <main id="app" class="app hidden">
    <header class="game-header">
      <div>
        <span class="mini">PLAYER</span>
        <h1>KIM YONGJIN</h1>
      </div>
      <div class="player-status">
        <span>LV.02</span>
        <span>IT SPECIALIST</span>
      </div>
    </header>

    <section class="hud">
      <div><span class="mini">MISSION</span><strong id="mission">町を探索しよう</strong></div>
      <div class="exp-wrap">
        <span class="mini">CAREER EXP</span>
        <div class="exp-bar"><i></i></div>
      </div>
      <button id="helpBtn" class="small-btn">?</button>
    </section>

    <section class="game-area">
      <div id="map" class="map" tabindex="0" aria-label="Portfolio map">
        <div class="grass-grid"></div>
        <div class="path path-h"></div>
        <div class="path path-v"></div>
        <div class="water"></div>

        <button class="place house p-about" data-section="about"><span class="roof"></span><span class="door"></span><b>HOME</b></button>
        <button class="place office p-career" data-section="career"><span class="roof"></span><span class="door"></span><b>CAREER</b></button>
        <button class="place lab p-projects" data-section="projects"><span class="roof"></span><span class="door"></span><b>LAB</b></button>
        <button class="place gym p-skills" data-section="skills"><span class="roof"></span><span class="door"></span><b>GYM</b></button>
        <button class="place center p-contact" data-section="contact"><span class="roof"></span><span class="door"></span><b>CONTACT</b></button>

        <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div>
        <div class="tree t4"></div><div class="tree t5"></div><div class="tree t6"></div>
        <div class="tree t7"></div><div class="tree t8"></div>

        <div class="sign" data-section="guide">!</div>
        <div class="npc" data-section="npc"><span></span><i></i></div>

        <div id="player" class="player down">
          <span class="hair"></span><span class="face"></span><span class="shirt"></span><span class="legs"></span>
        </div>
      </div>

      <div class="mobile-pad">
        <button data-key="ArrowUp">▲</button>
        <div>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="Enter">A</button>
          <button data-key="ArrowRight">▶</button>
        </div>
        <button data-key="ArrowDown">▼</button>
      </div>
    </section>

    <nav class="quick-nav">
      <button data-section="about">ABOUT</button>
      <button data-section="career">CAREER</button>
      <button data-section="projects">PROJECTS</button>
      <button data-section="skills">SKILLS</button>
      <button data-section="contact">CONTACT</button>
    </nav>
  </main>

  <div id="modal" class="modal hidden">
    <div class="dialog-box">
      <div class="dialog-head">
        <span id="dialogTitle">SYSTEM</span>
        <button id="closeBtn">×</button>
      </div>
      <div id="dialogBody" class="dialog-body"></div>
      <div class="dialog-foot">▼ ESCで閉じる</div>
    </div>
  </div>

  <template id="tpl-about">
    <article>
      <h2>ABOUT ME</h2>
      <p class="lead">技術とコミュニケーションをつなぎ、複雑な課題をわかりやすい形へ変えるITスペシャリストです。</p>
      <div class="grid-2">
        <dl>
          <dt>NAME</dt><dd>キム・ヨンジン</dd>
          <dt>BASE</dt><dd>埼玉県</dd>
          <dt>LANGUAGE</dt><dd>韓国語 / 日本語 / 英語</dd>
          <dt>STYLE</dt><dd>課題整理・分析・継続力</dd>
        </dl>
        <div class="info-card">
          <strong>PLAYER TRAITS</strong>
          <p>多文化環境での調整力、ユーザー視点、Web開発への挑戦を強みにしています。</p>
        </div>
      </div>
    </article>
  </template>

  <template id="tpl-career">
    <article>
      <h2>CAREER LOG</h2>
      <div class="timeline">
        <section>
          <span class="tag">2025 - NOW</span>
          <h3>日本アイ・ビー・エム デジタルサービス株式会社</h3>
          <p>金融業界向けWebシステムの保守運用に従事。障害調査、ログ分析、テスト、定期データ更新、簡易改修、関係者への報告を担当。</p>
          <div class="chips"><span>Java</span><span>JSP</span><span>SQL</span><span>Linux</span><span>DB2</span></div>
        </section>
        <section>
          <span class="tag">PAST QUESTS</span>
          <h3>営業・通訳・大学図書館・スポーツクラブ</h3>
          <p>営業通訳、多言語案内の改善、接客業務を経験。相手の背景を理解し、行動につながる提案を大切にしてきました。</p>
        </section>
      </div>
    </article>
  </template>

  <template id="tpl-projects">
    <article>
      <h2>PROJECT DEX</h2>
      <div class="project-grid">
        <a class="project-card" href="https://github.com/msuleu4-web/soccer-project" target="_blank" rel="noreferrer">
          <span class="tag">NO.001</span>
          <h3>GOAL LABO</h3>
          <p>サッカー情報、AI会話、予測・シミュレーションを組み合わせたWebサービス。</p>
          <div class="chips"><span>Next.js</span><span>Supabase</span><span>AWS</span></div>
          <b>OPEN GITHUB ↗</b>
        </a>
        <div class="project-card">
          <span class="tag">NO.002</span>
          <h3>SIer道場</h3>
          <p>SIer業務をゲーム形式で学べる教育コンテンツ。選択と結果から仕事の流れを体験できます。</p>
          <div class="chips"><span>Next.js</span><span>TypeScript</span><span>Phaser</span></div>
          <b>IN DEVELOPMENT</b>
        </div>
        <div class="project-card">
          <span class="tag">NO.003</span>
          <h3>STOCK ANALYSIS LAB</h3>
          <p>テクニカル指標とバックテストを用いた株式分析・予測の個人研究。</p>
          <div class="chips"><span>Python</span><span>Pandas</span><span>ML</span></div>
          <b>PERSONAL RESEARCH</b>
        </div>
      </div>
    </article>
  </template>

  <template id="tpl-skills">
    <article>
      <h2>SKILL GYM</h2>
      <div class="skills">
        <div><span>WEB / APP</span><div><i style="width:76%"></i></div><b>76</b></div>
        <div><span>CLOUD / AWS</span><div><i style="width:70%"></i></div><b>70</b></div>
        <div><span>ANALYSIS</span><div><i style="width:82%"></i></div><b>82</b></div>
        <div><span>COMMUNICATION</span><div><i style="width:90%"></i></div><b>90</b></div>
      </div>
      <div class="badges">
        <h3>BADGES</h3>
        <span>AWS Cloud Practitioner</span>
        <span>AWS AI Practitioner</span>
        <span>JLPT N1</span>
        <span>TOEFL iBT 97</span>
      </div>
    </article>
  </template>

  <template id="tpl-contact">
    <article>
      <h2>CONTACT CENTER</h2>
      <p class="lead">ポートフォリオをご覧いただき、ありがとうございます。</p>
      <div class="contact-actions">
        <a href="https://github.com/msuleu4-web" target="_blank" rel="noreferrer">GITHUB ↗</a>
        <a href="mailto:your-email@example.com">EMAIL</a>
      </div>
      <p class="note">index.html内の your-email@example.com を自分のメールアドレスに変更してください。</p>
    </article>
  </template>

  <script src="./script.js"></script>
</body>
</html>
