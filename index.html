            <p>受付・会員対応に加え、施設見学に来た見込み客への入会提案を担当。見学者の目的（運動習慣づくり・ダイエット・リハビリ等）をヒアリングし、目的に合ったプランやレッスンを提示して入会につなげた。対面で相手のニーズを引き出し、その場で提案に落とし込む実務を積んだ。</p>

            <div class="chips"><span>R</span><span>多言語対応</span><span>ユーザー調査</span></div>

        </article>
        <article>
          <div class="career-date">2021 — 2022</div>
          <div>

            <p>大阪府内の中学校・高校に出向き、韓国文化を紹介する出張授業を企画・実施。コロナ禍で対面訪問が制限された際は、他の担当者でも同内容を届けられるよう授業のテンプレート動画を制作した。また、市役所職員を対象とした外国人対応シミュレーションにも参加した。</p>
            <div class="chips"><span>異文化理解教育</span><span>コンテンツ制作</span><span>多文化共生</span></div>

            <div class="chips"><span>行政実務</span><span>業務改善</span></div>
